{% extends "trading/base.html" %}
{% block title %}Log in · Algo Trader{% endblock %}
{% block content %}
<form method="post" class="login">{% csrf_token %}
  <h1>Log in</h1>
  {% if form.errors %}<p class="err">Invalid username or password.</p>{% endif %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn dark">Log in</button>
</form>
{% endblock %}
